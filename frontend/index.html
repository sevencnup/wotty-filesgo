<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>FilesGO - 简单的文件传输</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              }
            }
          }
        }
      }
    </script>
    <style>
      .glass {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }
      .tab-active {
        border-bottom: 2px solid #2563eb;
        color: #2563eb;
        font-weight: 600;
        background-color: rgba(37, 99, 235, 0.05);
      }
      .tab-inactive {
        color: #64748b;
        border-bottom: 2px solid transparent;
      }
      .tab-inactive:hover {
        color: #334155;
        background-color: rgba(241, 245, 249, 0.5);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] min-h-screen text-slate-800 font-sans flex flex-col relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-100/50 rounded-full blur-3xl opacity-60 mix-blend-multiply filter"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-slate-200/50 rounded-full blur-3xl opacity-60 mix-blend-multiply filter"></div>
    </div>

    <div id="app" class="container mx-auto px-4 py-12 max-w-xl flex-grow flex flex-col justify-center">
      <header class="mb-12 flex items-center justify-center gap-x-6">
        <div
          class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 text-white shadow-lg shadow-blue-500/30 overflow-hidden shrink-0"
        >
          <img src="/logo.png" class="w-14 h-14 object-contain" alt="Logo" />
        </div>
        <div class="text-left">
          <h1 class="text-3xl font-bold text-slate-900 mb-1 tracking-tight">FilesGO</h1>
          <p class="text-slate-500 font-medium">安全 · 高效</p>
        </div>
      </header>

      <!-- Main Card -->
      <div class="glass rounded-3xl border border-white/60 overflow-hidden transition-all duration-300">
        <!-- Tabs -->
        <div class="flex border-b border-slate-100">
          <button id="tab-send" class="flex-1 py-5 text-center text-sm tracking-wide transition-all tab-active">
            我要发送
          </button>
          <button id="tab-receive" class="flex-1 py-5 text-center text-sm tracking-wide transition-all tab-inactive">
            我要接收
          </button>
        </div>

        <!-- Content Area -->
        <div class="p-8 md:p-10 min-h-[460px] flex flex-col justify-center">
          
          <!-- Send Panel -->
          <div id="panel-send" class="block">
            <!-- Upload Area -->
            <div id="upload-area" class="transition-all duration-300">
              <label
                for="dropzone-file"
                class="flex flex-col items-center justify-center w-full h-80 border-2 border-slate-200 border-dashed rounded-2xl cursor-pointer hover:border-blue-400 hover:bg-blue-50/30 transition-all group relative overflow-hidden"
              >
                <div class="flex flex-col items-center justify-center pt-5 pb-6 z-10">
                  <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 shadow-sm">
                      <svg
                        class="w-10 h-10 text-slate-400 group-hover:text-blue-500 transition-colors"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                      </svg>
                  </div>
                  <p class="mb-3 text-lg font-medium text-slate-600">
                    点击或拖拽文件
                  </p>
                  <p class="text-sm text-slate-400">支持任意格式 · 最大 10GB</p>
                </div>
                <input id="dropzone-file" type="file" class="hidden" />
              </label>
            </div>

            <!-- Upload Progress / Result -->
            <div id="upload-result" class="hidden text-center animate-fade-in">
              <div id="processing-state" class="hidden">
                 <div class="animate-spin rounded-full h-10 w-10 border-[3px] border-slate-200 border-t-blue-600 mx-auto mb-6"></div>
                 <p class="text-slate-600 font-medium">正在加密上传...</p>
              </div>

              <div id="success-state" class="hidden">
                <div class="text-center py-4">
                  <p class="text-slate-500 text-sm mb-4">上传成功，您的取件码是：</p>
                  
                  <!-- Code Display -->
        <div class="bg-blue-50 border-2 border-blue-100 rounded-2xl p-6 mb-6 cursor-pointer hover:bg-blue-100 transition-colors relative group" onclick="copyCode(this)">
          <div class="text-5xl font-mono font-black tracking-[0.2em] text-blue-600" id="result-code">------</div>
          <div class="absolute inset-0 flex items-center justify-center bg-blue-600/10 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl">
              <span class="text-blue-700 font-semibold">点击复制</span>
          </div>
        </div>

        <!-- Big Copy Button -->
        <button onclick="copyCode(this)" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all mb-6 flex items-center justify-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    复制取件码
                  </button>

                  <button onclick="resetUpload()" class="text-slate-400 hover:text-slate-600 text-sm font-medium">
                    继续发送
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Receive Panel -->
          <div id="panel-receive" class="hidden">
            <div class="flex flex-col space-y-6">
              <div>
                <label for="code-input" class="block text-sm font-medium text-slate-600 mb-3 ml-1">输入 6 位取件码</label>
                <input type="text" id="code-input" placeholder="A1B2C3" maxlength="6" 
                  class="block w-full px-4 py-5 text-2xl font-mono text-center text-slate-800 border-2 border-slate-200 rounded-xl focus:ring-0 focus:border-blue-500 focus:bg-white placeholder-slate-300 uppercase tracking-[0.2em] bg-slate-50 transition-all outline-none"
                >
              </div>
              <button id="btn-download" class="w-full bg-blue-600 text-white py-4 rounded-xl text-base font-semibold hover:bg-blue-700 active:transform active:scale-[0.98] transition-all shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
                立即下载
              </button>
              <div id="receive-status" class="text-center text-xs text-slate-400 min-h-[20px] font-medium"></div>
            </div>
          </div>

        </div>
      </div>
      
      <footer class="mt-12 text-center text-slate-300 text-xs">
        <p>© 2026 filesGO · 12H Auto-Destruct</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
