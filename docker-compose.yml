version: "3.9"
services:
  wotty-filesgo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/wotty-filesgo.db:/app/wotty-filesgo.db
      - ./config.yaml:/app/config.yaml
    environment:
      - GIN_MODE=release
    restart: unless-stopped
