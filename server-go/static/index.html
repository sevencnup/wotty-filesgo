<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简云盘 (Rust + Go)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen text-gray-800 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">☁️ 极简云盘</h1>
            <p class="text-gray-500">后端：Go (API) + Rust (核心处理)</p>
        </header>

        <!-- Upload Section -->
        <div class="glass rounded-xl shadow-lg p-6 mb-8 border border-white/50">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">📤 上传文件</h2>
            <div class="flex items-center justify-center w-full">
                <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-indigo-300 border-dashed rounded-lg cursor-pointer bg-white/50 hover:bg-white/80 transition-all">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-4 text-indigo-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">点击上传</span> 或拖拽文件至此</p>
                    </div>
                    <input id="dropzone-file" type="file" class="hidden" onchange="handleUpload(this.files[0])" />
                </label>
            </div>
            <div id="upload-status" class="mt-4 text-center text-sm hidden"></div>
        </div>

        <!-- File List -->
        <div class="glass rounded-xl shadow-lg p-6 border border-white/50">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">📂 文件列表</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-indigo-50 text-indigo-700 uppercase">
                        <tr>
                            <th scope="col" class="px-6 py-3 rounded-l-lg">文件名</th>
                            <th scope="col" class="px-6 py-3">大小</th>
                            <th scope="col" class="px-6 py-3">SHA256 Hash (Rust Generated)</th>
                            <th scope="col" class="px-6 py-3 rounded-r-lg">操作</th>
                        </tr>
                    </thead>
                    <tbody id="file-list">
                        <!-- JS renders rows here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Utilities
        const formatSize = (bytes) => {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        // API Calls
        async function fetchFiles() {
            try {
                const res = await fetch('/api/files');
                const files = await res.json();
                renderList(files);
            } catch (e) {
                console.error("Failed to fetch files", e);
            }
        }

        async function handleUpload(file) {
            if (!file) return;

            const statusDiv = document.getElementById('upload-status');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = `<span class="text-indigo-600 animate-pulse">正在上传并由 Rust 处理中...</span>`;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    statusDiv.innerHTML = `<span class="text-green-600">上传成功！</span>`;
                    fetchFiles();
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">上传失败</span>`;
                }
            } catch (e) {
                statusDiv.innerHTML = `<span class="text-red-600">错误: ${e.message}</span>`;
            }
            
            setTimeout(() => statusDiv.classList.add('hidden'), 3000);
        }

        function renderList(files) {
            const tbody = document.getElementById('file-list');
            tbody.innerHTML = files.map(file => `
                <tr class="bg-white/40 border-b hover:bg-white/80 transition-colors">
                    <td class="px-6 py-4 font-medium text-gray-900">${file.filename}</td>
                    <td class="px-6 py-4">${formatSize(file.size)}</td>
                    <td class="px-6 py-4 font-mono text-xs text-gray-500 break-all w-1/3">${file.hash}</td>
                    <td class="px-6 py-4">
                        <a href="/api/download/${file.id}" target="_blank" class="text-indigo-600 hover:text-indigo-900 font-semibold hover:underline">下载</a>
                    </td>
                </tr>
            `).join('');
        }

        // Init
        fetchFiles();
    </script>
</body>
</html>
