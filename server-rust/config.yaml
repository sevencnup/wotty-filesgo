# wotty FilesGO 配置文件

# 服务器配置
server:
  port: 3003

# 文件保留时间
retention:
  initial_hours: 2    # 上传后保留时间（小时）
  after_download_hours: 2  # 首次下载后保留时间（小时）
  max_lifetime_hours: 2    # 最大存活时间（小时），上传后不管是否取件都强制删除

# 上传频率限制
rate_limit:
  max_uploads_per_day: 20   # 每个IP每天最多上传次数（0表示不限制）
  allowed_ips: []           # 免除上传次数限制的IP白名单，例如 ["203.0.113.10"]
  trusted_proxy_ips: []     # 信任并读取 X-Forwarded-For 的反向代理IP；直连部署保持为空

# 站点访问安全
security:
  site_password: ""     # 访问网站密码；留空表示关闭密码保护
  max_login_attempts_per_minute: 10  # 单个IP每分钟最多尝试登录次数

# 上传配置
upload:
  max_file_size_gb: 10      # 单个文件最大大小（GB）
  max_total_size_gb: 20     # 当前批次最多选择的文件总大小（GB）
  chunk_size_mb: 8          # 分片大小（MB），允许 1-32 MB
