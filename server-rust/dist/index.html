<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo.png" />
    <title>FilesGO - 简单的文件传输</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/main-fLHpSqSN.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/style-BqYkr6oB.js">
    <link rel="stylesheet" crossorigin href="/assets/style-D_K8KY60.css">
  </head>
  <body class="bg-[#f8fafc] min-h-screen text-slate-800 font-sans flex flex-col relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-100/50 rounded-full blur-3xl opacity-60 mix-blend-multiply filter"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-slate-200/50 rounded-full blur-3xl opacity-60 mix-blend-multiply filter"></div>
    </div>

    <div id="app" class="container mx-auto px-4 py-6 md:py-12 max-w-xl flex-grow flex flex-col justify-center">
      <header class="mb-6 md:mb-12 flex items-center justify-center gap-x-4 md:gap-x-6">
        <div class="inline-flex items-center justify-center shrink-0">
          <img src="/logo.png" class="w-16 h-16 md:w-24 md:h-24 object-contain" alt="Logo" />
        </div>
        <div class="text-left">
          <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-0 md:mb-1 tracking-tight">FilesGO</h1>
          <p class="text-slate-500 text-sm md:text-base font-medium">安全 · 高效</p>
        </div>
      </header>

      <!-- Main Card -->
      <div class="glass rounded-3xl border border-white/60 overflow-hidden transition-all duration-300">
        <!-- Tabs -->
        <div class="flex border-b border-slate-100">
          <button id="tab-send" class="flex-1 py-4 md:py-5 text-center text-sm tracking-wide transition-all tab-active">
            我要发送
          </button>
          <button id="tab-receive" class="flex-1 py-4 md:py-5 text-center text-sm tracking-wide transition-all tab-inactive">
            我要接收
          </button>
        </div>

        <!-- Content Area -->
        <div class="p-6 md:p-10 min-h-[380px] md:min-h-[460px] flex flex-col justify-center">
          
          <!-- Send Panel -->
          <div id="panel-send" class="block">
            <!-- Password Input -->
            <div id="password-section" class="mb-6">
              <input type="password" id="password-input" placeholder="请输入上传密码" 
                class="block w-full px-4 py-4 text-base text-slate-800 border-2 border-slate-200 rounded-xl focus:ring-0 focus:border-blue-500 focus:bg-white placeholder-slate-300 bg-slate-50 transition-all outline-none"
              >
              <p class="text-xs text-slate-400 mt-2 ml-1">需要密码才能上传文件</p>
            </div>

            <!-- Upload Area -->
            <div id="upload-area" class="transition-all duration-300 mb-6 hidden">
              <label
                for="dropzone-file"
                class="flex flex-col items-center justify-center w-full h-48 md:h-56 border-2 border-slate-200 border-dashed rounded-2xl cursor-pointer hover:border-blue-400 hover:bg-blue-50/30 transition-all group relative overflow-hidden"
              >
                <div class="flex flex-col items-center justify-center pt-5 pb-6 z-10">
                  <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300 shadow-sm">
                      <svg
                        class="w-8 h-8 text-slate-400 group-hover:text-blue-500 transition-colors"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                      </svg>
                  </div>
                  <p class="mb-2 text-base font-medium text-slate-600">
                    点击或拖拽文件
                  </p>
                  <p class="text-xs text-slate-400">支持任意格式 · 最大 10GB</p>
                </div>
                <input id="dropzone-file" type="file" class="hidden" />
              </label>
            </div>

            <!-- Upload Queue -->
            <div id="upload-queue" class="hidden space-y-3 mb-6"></div>

            <!-- Current Upload Progress -->
            <div id="current-upload" class="hidden text-center py-4">
              <p class="text-slate-600 font-medium mb-3" id="current-filename">正在上传...</p>
              <div class="w-full max-w-xs mx-auto mb-2">
                <div class="h-3 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                  <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-blue-600 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                </div>
              </div>
              <p id="progress-text" class="text-sm text-slate-400 font-medium">0%</p>
            </div>

            <!-- Upload Results -->
            <div id="upload-results" class="hidden space-y-4">
              <!-- Multiple Results Container -->
              <div id="multiple-results" class="space-y-4">
                <!-- Individual Result Card (template for multiple files) -->
                <div class="bg-blue-8050/ border-2 border-blue-100/50 rounded-2xl p-5 animate-fade-in">
                  <div class="flex items-start justify-between mb-3">
                    <p class="text-slate-700 text-sm font-medium truncate pr-2" data-filename>filename.ext</p>
                    <span class="text-xs text-slate-400 whitespace-nowrap bg-blue-100/50 px-2 py-0.5 rounded">取件码</span>
                  </div>
                  <div class="text-3xl font-mono font-bold tracking-[0.15em] text-blue-600 cursor-pointer hover:bg-blue-200/50 rounded-xl p-3 transition-all text-center mb-3 select-all" data-code onclick="copyCode(this)">------</div>
                  <p class="text-xs text-slate-400 text-center mb-4">点击复制取件码</p>
                  
                  <div class="border-t border-blue-200/50 pt-4 mt-2">
                    <p class="text-xs text-slate-400 mb-2 text-left">分享链接</p>
                    <div class="flex items-center gap-2 bg-white/80 rounded-xl p-2.5 border border-blue-200/50 shadow-sm">
                      <input type="text" readonly class="flex-1 text-xs text-slate-600 bg-transparent outline-none font-mono truncate" data-link value="">
                      <button onclick="copyLink(this)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-medium px-4 py-2 rounded-lg transition-colors whitespace-nowrap">
                        复制链接
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- Batch Actions for Multiple Files -->
              <div class="bg-slate-50/80 border border-slate-200/50 rounded-xl p-4 flex items-center justify-center gap-4" id="batch-actions">
                <button class="text-slate-500 hover:text-slate-700 text-sm font-medium transition-colors flex items-center gap-1.5" onclick="copyAllCodes()">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                  </svg>
                  复制全部取件码
                </button>
                <span class="text-slate-300">|</span>
                <button class="text-slate-500 hover:text-slate-700 text-sm font-medium transition-colors flex items-center gap-1.5" onclick="resetUpload()">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                  </svg>
                  继续发送
                </button>
              </div>
            </div>

            <!-- Single Result Card (for single file) -->
            <div id="single-result" class="hidden text-center animate-fade-in">
              <div class="bg-blue-50 border-2 border-blue-100 rounded-2xl p-6 mb-4">
                <p class="text-slate-500 text-sm mb-2" id="single-filename">filename.ext</p>
                <p class="text-slate-500 text-xs mb-3">取件码</p>
                <div class="text-4xl font-mono font-black tracking-[0.2em] text-blue-600 cursor-pointer hover:bg-blue-100 rounded-xl p-3 transition-colors mb-3" id="single-code" onclick="copySingleCode(this)">------</div>
                <p class="text-xs text-slate-400 mb-4">点击复制取件码</p>
                
                <div class="border-t border-blue-200 pt-4 mt-2">
                  <p class="text-slate-500 text-xs mb-2">分享链接</p>
                  <div class="flex items-center gap-2 bg-white rounded-xl p-2 border border-blue-200">
                    <input type="text" id="download-link" readonly class="flex-1 text-xs text-slate-600 bg-transparent outline-none font-mono" value="">
                    <button onclick="copyDownloadLink()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap">
                      复制链接
                    </button>
                  </div>
                </div>
              </div>
              <button onclick="resetUpload()" class="text-slate-400 hover:text-slate-600 text-sm font-medium transition-colors">
                继续发送
              </button>
            </div>
          </div>

          <!-- Receive Panel -->
          <div id="panel-receive" class="hidden">
            <div class="flex flex-col space-y-6">
              <div>
                <label for="code-input" class="block text-sm font-medium text-slate-600 mb-3 ml-1">输入 6 位取件码</label>
                <input type="text" id="code-input" placeholder="A1B2C3" maxlength="6" 
                  class="block w-full px-4 py-5 text-2xl font-mono text-center text-slate-800 border-2 border-slate-200 rounded-xl focus:ring-0 focus:border-blue-500 focus:bg-white placeholder-slate-300 uppercase tracking-[0.2em] bg-slate-50 transition-all outline-none"
                >
              </div>
              <button id="btn-download" class="w-full bg-blue-600 text-white py-4 rounded-xl text-base font-semibold hover:bg-blue-700 active:transform active:scale-[0.98] transition-all shadow-lg shadow-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
                立即下载
              </button>
              <div id="receive-status" class="text-center text-xs text-slate-400 min-h-[20px] font-medium"></div>
            </div>
          </div>

        </div>
      </div>
      
      <footer class="mt-8 md:mt-12 text-center">
        <p class="text-slate-400 text-xs font-medium tracking-widest uppercase mb-3">
          &copy; 2026 星七七  FilesGO 文件传输&middot; 2H Auto-Destruct
        </p>
        <a href="/chat.html" class="inline-flex items-center gap-2 text-blue-500 hover:text-blue-600 text-sm font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          设备聊天模式
        </a>
      </footer>
    </div>
  </body>
</html>
